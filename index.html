<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gooseberry Ad Naming Tool</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@1,400;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script defer src="catalog.js"></script><script defer src="naming.js"></script><script defer src="app.js"></script></head>
<body><main><header><h1>Gooseberry Ad Naming Tool</h1><div class="mode-control"><span id="single-label">Single</span><button type="button" id="mode" role="switch" aria-checked="false" aria-label="Batch generation"><span></span></button><span id="batch-label">Batch</span></div></header>
<form id="form"><div id="single"><div id="single-entries" class="entries"></div></div><div id="batch" hidden><section class="shared"><h2>Constant Values</h2><div id="constants" class="grid"></div></section><div id="batch-entries" class="entries"></div></div><div class="actions"><button type="button" id="add" class="outline">ADD ANOTHER <span aria-hidden="true">＋</span></button><button type="submit">Generate ad names <span aria-hidden="true">↗</span></button></div><p id="error" role="alert"></p></form>
<section class="output" aria-labelledby="output-heading"><div class="output-header"><h2 id="output-heading">Ad names</h2><button id="copy-all" type="button" hidden>Copy all</button></div><p id="empty">Generate to create 4x5, 1x1 and 9x16 names for each entry.</p><div id="results"></div><div id="status" role="status" aria-live="polite"></div></section></main></body></html>
