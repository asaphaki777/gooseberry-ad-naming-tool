<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gooseberry Ad Naming Tool</title><link rel="stylesheet" href="styles.css?v=fields-2"><script defer src="catalog.js"></script><script defer src="naming.js"></script><script defer src="app.js?v=fields-2"></script></head>
<body><main><header><h1 class="brand-heading"><img src="gooseberry-logo.png" alt="Gooseberry"><span class="brand-divider" aria-hidden="true"></span><span>AD NAMING TOOL</span></h1></header>
<form id="form"><div id="batch"><p class="batch-help">Lock any field to share its value across all entries. Unlocked fields stay editable in each entry.</p><div id="batch-entries" class="entries"></div></div><div class="actions"><button type="button" id="add" class="outline">ADD ANOTHER <span aria-hidden="true">＋</span></button><button type="submit">Generate ad names <span aria-hidden="true">↗</span></button></div><p id="error" role="alert"></p></form>
<section class="output" aria-labelledby="output-heading"><div class="output-header"><h2 id="output-heading">AD NAMES WILL SHOW UP HERE</h2><button id="copy-all" type="button" hidden>Copy all</button></div><p id="empty">Generate to create 4x5, 1x1 and 9x16 names for each entry.</p><div id="results"></div><div id="status" role="status" aria-live="polite"></div></section></main></body></html>
